name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
      - name: Run test suite
        run: tests/run_tests.sh

  quality:
    # The main branch ruleset requires this check name.
    name: Static and distribution checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans every commit, not only the checked-out one.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run Ruff checks
        run: |
          ruff check .
          ruff format --check .
      - name: Run ShellCheck
        run: shellcheck install.sh tests/run_tests.sh tools/benchmark.sh
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Scan the git history for secrets
        run: pre-commit run gitleaks-history --hook-stage manual --all-files
      - name: Smoke-test zipapp
        run: |
          python tools/build_zipapp.py
          ./dist/qdu --version

