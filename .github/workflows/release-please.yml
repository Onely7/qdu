name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Propose or publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Update Release PR or create GitHub Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  wheels:
    name: Build wheel (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # manylinux2014 wheels run on glibc 2.17 and later.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          # The musl builds are static; their binaries also go to the release.
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - runner: macos-latest
            target: x86_64-apple-darwin
            manylinux: "off"
          - runner: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Build source distribution
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Build the source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload the source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke:
    # Run each kind of binary once before anything is published.
    name: Smoke-test ${{ matrix.target }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheel
      - name: Run the binary
        run: |
          unzip -q -j wheel/*.whl '*.data/scripts/qdu' -d bin
          chmod 755 bin/qdu
          export HOME="$RUNNER_TEMP/home" XDG_STATE_HOME="$RUNNER_TEMP/state"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/config"
          mkdir -p "$HOME" "$RUNNER_TEMP/tree/data"
          head -c 65536 /dev/zero > "$RUNNER_TEMP/tree/data/file"
          bin/qdu --version
          bin/qdu snapshot --path "$RUNNER_TEMP/tree"
          bin/qdu show --format json | grep -q '"path": "data"'

  pypi:
    # PyPI accepts these files from this workflow and environment only; see
    # "Publishing a release" in docs/DEVELOPMENT.md.
    name: Publish to PyPI
    needs: [release-please, wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qdu/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  binaries:
    name: Attach binaries and publish the release
    needs: [release-please, wheels, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          path: source
      - name: Download the wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: wheels
      - name: Package the binaries
        # Each wheel holds the binary at qdu-<version>.data/scripts/qdu. The
        # glibc builds run on glibc 2.17 and later and allocate faster under
        # many threads; the static musl builds are for Alpine and other
        # systems without glibc.
        run: |
          mkdir release
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                        x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
                        x86_64-apple-darwin aarch64-apple-darwin; do
            work="unpacked/$target"
            mkdir -p "$work"
            unzip -q -j wheels/wheel-"$target"/*.whl '*.data/scripts/qdu' -d "$work"
            chmod 755 "$work/qdu"
            cp source/LICENSE source/README.md "$work/"
            tar -czf "release/qdu-$target.tar.gz" -C "$work" qdu LICENSE README.md
          done
          (cd release && sha256sum qdu-*.tar.gz > SHA256SUMS)
      - name: Upload release assets and publish the release
        # The release stays a draft until its binaries are attached.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
