[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdu"
version = "0.0.1"
description = "Profile-aware disk-usage snapshots for ordinary users"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qdu = "qdu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
