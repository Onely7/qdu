[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdu"
dynamic = ["version"]
description = "Profile-aware disk-usage snapshots for ordinary users"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.0",
    "ruff==0.15.22",
]

[project.scripts]
qdu = "qdu.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = { attr = "qdu._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PIE",
    "RUF",
    "S",
    "SIM",
    "UP",
]
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D100", "D101", "D102", "D103", "S101"]
"tests/test_distribution.py" = ["S603"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true
