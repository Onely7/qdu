# The PyPI package ships the compiled qdu binary; it contains no Python code.
# `uvx qdu`, `uv tool install qdu`, and `pipx install qdu` put it on PATH.
[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "qdu"
description = "Record disk-usage snapshots of a directory tree and see where space goes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Onely7" }]
requires-python = ">=3.8"
keywords = ["disk-usage", "du", "snapshot", "filesystem", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Onely7/qdu"
Documentation = "https://github.com/Onely7/qdu/tree/main/docs"
Changelog = "https://github.com/Onely7/qdu/blob/main/CHANGELOG.md"
Issues = "https://github.com/Onely7/qdu/issues"

[tool.maturin]
bindings = "bin"
strip = true
